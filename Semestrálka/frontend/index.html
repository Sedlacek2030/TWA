<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Briefing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
            color: #222;
        }
        h1, h2 {
            color: #0a3f66;
        }
        .form-row {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #0a3f66;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0d517f;
        }
        .poi-item {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fdfdfd;
        }
        .poi-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }
        .poi-text {
            min-width: 0;
        }
        .poi-coords {
            margin-top: 6px;
            color: #555;
            font-size: 0.95rem;
        }
        .poi-actions {
            position: relative;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #0a3f66;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .action-btn:hover {
            background: #eef3fa;
        }
        .action-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 32px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            z-index: 10;
            min-width: 130px;
        }
        .action-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 10px 12px;
            cursor: pointer;
            color: #222;
        }
        .action-menu button:hover {
            background: #f2f6fb;
        }
        .secondary-btn {
            background: #656d7a;
            margin-left: 12px;
        }
        #status {
            margin-bottom: 12px;
            min-height: 18px;
        }
        .config {
            margin-bottom: 18px;
        }
        #map {
            width: 100%;
            height: 420px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        #app {
            display: none;
        }
        #login-section {
            margin-bottom: 24px;
        }
        .login-box {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <h1>Mission Briefing System</h1>
    <section id="login-section">
        <h2>Login Required</h2>
        <div class="login-box">
            <form id="login-form">
                <div class="form-row">
                    <label>Username <input id="login-user" placeholder="Name"></label>
                </div>
                <div class="form-row">
                    <label>Password <input id="login-pass" type="password" placeholder="Password"></label>
                </div>
                <button type="submit">Log In</button>
            </form>
        </div>
    </section>

    <div class="config">
        <strong>Backend URL:</strong>
        <code id="backend-url"></code>
    </div>

    <div id="status"></div>

    <div id="app">
        <div id="map"></div>

        <section>
            <h2>POIs</h2>
            <div id="list"></div>
        </section>

        <section>
            <h2>Add Point of Interest</h2>
            <div class="form-row">
                <label>Name <input id="name" placeholder="Name"></label>
            </div>
            <div class="form-row">
                <label>Latitude <input id="lat" placeholder="Latitude"></label>
            </div>
            <div class="form-row">
                <label>Longitude <input id="lon" placeholder="Longitude"></label>
            </div>
            <div class="form-row">
                <label>Affiliation
                    <select id="affiliation">
                        <option value="Friend">Friend</option>
                        <option value="Neutral">Neutral</option>
                        <option value="Foe">Foe</option>
                    </select>
                </label>
            </div>
            <button id="add-poi-btn" type="button" onclick="addPoi()">Add POI</button>
            <button id="cancel-edit-btn" class="secondary-btn" type="button" onclick="cancelEdit()" style="display:none;">Cancel</button>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
