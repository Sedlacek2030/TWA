<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Briefing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
    <h1>Mission Briefing System</h1>
    <div id="welcome-text" class="welcome-text" style="display:none;"></div>
    <section id="login-section">
        <h2>Login Required</h2>
        <div class="login-box">
            <form id="login-form">
                <div class="form-row">
                    <label>Username <input id="login-user" placeholder="Name"></label>
                </div>
                <div class="form-row">
                    <label>Password <input id="login-pass" type="password" placeholder="Password"></label>
                </div>
                <button type="submit">Log In</button>
            </form>
        </div>
    </section>

    <div id="status"></div>

    <div id="app">
        <div id="map"></div>

        <section>
            <div class="list-header">
                <h2>POIs</h2>
                <button id="filter-button" class="filter-button" type="button" aria-label="Filter POIs">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18">
                        <path fill="currentColor" d="M3 4h18l-7 8.5V19l-4-2v-4.5L3 4z" />
                    </svg>
                </button>
            </div>
            <div id="filter-panel" class="filter-panel" style="display:none;">
                <span>Map visibility:</span>
                <label><input type="checkbox" checked onchange="toggleAffiliationFilter('Friend', this)"> Friend</label>
                <label><input type="checkbox" checked onchange="toggleAffiliationFilter('Neutral', this)"> Neutral</label>
                <label><input type="checkbox" checked onchange="toggleAffiliationFilter('Foe', this)"> Foe</label>
            </div>
            <div id="list"></div>
        </section>

        <section>
            <h2>Add Point of Interest</h2>
            <div class="form-row">
                <label>Name <input id="name" placeholder="Name"></label>
            </div>
            <div class="form-row">
                <label>Latitude <input id="lat" placeholder="Latitude"></label>
            </div>
            <div class="form-row">
                <label>Longitude <input id="lon" placeholder="Longitude"></label>
            </div>
            <div class="form-row">
                <label>Affiliation
                    <select id="affiliation">
                        <option value="Friend">Friend</option>
                        <option value="Neutral">Neutral</option>
                        <option value="Foe">Foe</option>
                    </select>
                </label>
            </div>
            <button id="add-poi-btn" type="button" onclick="addPoi()">Add POI</button>
            <button id="cancel-edit-btn" class="secondary-btn" type="button" onclick="cancelEdit()" style="display:none;">Cancel</button>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
