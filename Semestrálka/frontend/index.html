<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Briefing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Mission Briefing System</h1>
    <section id="login-section">
        <h2>Login Required</h2>
        <div class="login-box">
            <form id="login-form">
                <div class="form-row">
                    <label>Username <input id="login-user" placeholder="Name"></label>
                </div>
                <div class="form-row">
                    <label>Password <input id="login-pass" type="password" placeholder="Password"></label>
                </div>
                <button type="submit">Log In</button>
            </form>
        </div>
    </section>

    <div class="config">
        <strong>Backend URL:</strong>
        <code id="backend-url"></code>
    </div>

    <div id="status"></div>

    <div id="app">
        <div id="map"></div>

        <section>
            <h2>POIs</h2>
            <div id="list"></div>
        </section>

        <section>
            <h2>Add Point of Interest</h2>
            <div class="form-row">
                <label>Name <input id="name" placeholder="Name"></label>
            </div>
            <div class="form-row">
                <label>Latitude <input id="lat" placeholder="Latitude"></label>
            </div>
            <div class="form-row">
                <label>Longitude <input id="lon" placeholder="Longitude"></label>
            </div>
            <div class="form-row">
                <label>Affiliation
                    <select id="affiliation">
                        <option value="Friend">Friend</option>
                        <option value="Neutral">Neutral</option>
                        <option value="Foe">Foe</option>
                    </select>
                </label>
            </div>
            <button id="add-poi-btn" type="button" onclick="addPoi()">Add POI</button>
            <button id="cancel-edit-btn" class="secondary-btn" type="button" onclick="cancelEdit()" style="display:none;">Cancel</button>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
